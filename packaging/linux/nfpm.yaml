name: orcaton
arch: ${ORCATON_ARCH}
platform: linux
version: ${ORCATON_VERSION}
version_schema: none
release: 1
section: video
priority: optional
maintainer: Athlon1323 <Athlon1323@users.noreply.github.com>
vendor: Athlon1323
license: Apache-2.0
description: |-
  Multicam audio sync for video editors.
  Orcaton lines up video and audio files from several cameras and recorders
  by their sound and saves the timeline back (FCP7 XML, DRT): a desktop window
  and the orcaton command for the terminal. FFmpeg is used as an external program.

overrides:
  deb:
    depends:
      - libgtk-3-0t64 | libgtk-3-0
      - libwebkit2gtk-4.1-0
      - ffmpeg
  rpm:
    depends:
      - libgtk-3.so.0()(64bit)
      - libwebkit2gtk-4.1.so.0()(64bit)
      - /usr/bin/ffmpeg

contents:
  - src: app-gui/build/bin/orcaton-gui
    dst: /usr/bin/orcaton-gui
    file_info:
      mode: 0755
  - src: app-gui/build/bin/orcaton
    dst: /usr/bin/orcaton
    file_info:
      mode: 0755
  - src: packaging/linux/orcaton.desktop
    dst: /usr/share/applications/orcaton.desktop
    file_info:
      mode: 0644
  - src: packaging/linux/icons/orcaton-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/orcaton.png
    file_info:
      mode: 0644
  - src: packaging/linux/icons/orcaton-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/orcaton.png
    file_info:
      mode: 0644
