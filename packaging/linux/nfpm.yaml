    dst: /usr/share/icons/hicolor/128x128/apps/orcaton.png
    file_info:
      mode: 0644
  - src: packaging/linux/icons/orcaton-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/orcaton.png
    file_info:
      mode: 0644
  - src: packaging/linux/icons/orcaton-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/orcaton.png
    file_info:
      mode: 0644
  - src: packaging/linux/copyright
    dst: /usr/share/doc/orcaton/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/orcaton/LICENSE
    packager: deb
    file_info:
      mode: 0644
  - src: NOTICE
    dst: /usr/share/doc/orcaton/NOTICE
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
